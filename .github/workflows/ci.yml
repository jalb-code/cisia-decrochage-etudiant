name: CI

# Sur toutes les branches (push) et sur toutes les pull requests.
on:
  push:
  pull_request:

jobs:
  quality:
    name: Qualité (ruff + gitleaks + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet requis pour le scan gitleaks

      - name: Installer uv (+ Python)
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Installer les dépendances
        # Suite de tests complète : `analysis` (test_modeling → xgboost/optuna) + `cli` (test_cli → typer).
        run: uv sync --group analysis --group cli

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — vérification du formatage
        run: uv run ruff format --check .

      - name: Gitleaks — détection de secrets
        run: |
          # Version pinnée une seule fois, dans .pre-commit-config.yaml (pas de doublon ici).
          GITLEAKS_VERSION=$(grep -A1 'gitleaks/gitleaks' .pre-commit-config.yaml | sed -n 's/.*rev: *v\?\([0-9.]*\).*/\1/p')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

      - name: Tests unitaires
        run: uv run pytest

  securite:
    name: Sécurité (CVE high/critique)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv (+ Python)
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Exporter les dépendances résolues (tous groupes)
        # requirements.txt : entrée universellement parsée par Trivy, gelée sur uv.lock.
        run: uv export --frozen --all-groups --no-emit-project --format requirements-txt -o requirements.txt

      - name: Trivy — CVE high/critique (échec bloquant)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true # ne bloque pas sur une CVE sans correctif publié
          exit-code: "1" # échoue la CI si une CVE high/critique corrigeable est trouvée
