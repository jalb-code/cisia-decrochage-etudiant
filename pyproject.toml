# --- Build : package installé en éditable (uv sync) pour être importable partout. ---
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decrochage-l1"
version = "0.1.0"
description = "Détection précoce du décrochage étudiant en L1 (cas d'usage certification IA)."
readme = "README.md"
requires-python = ">=3.13,<3.14"  # dupliqué volontairement dans .python-version (lu par uv/pyenv)
# Runtime STRICT du service d'inférence (§10-§11) : c'est l'empreinte de l'image API.
# Tout ce qui ne sert qu'à *produire* le dossier d'étude (traçage, SHAP, réglage, tracé)
# est écarté ici et rangé dans le groupe `analysis` ci-dessous, hors image.
dependencies = [
    "numpy>=2.3,<2.4",  # borné : numba (dépendance de SHAP, groupe analysis) plafonne à numpy 2.3
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "joblib>=1.4",  # sérialisation des pipelines (§10) — explicite, pas seulement transitif
    "pydantic>=2.7",  # schémas d'entrée/sortie de l'API (contrat validé)
    "pydantic-settings>=2.3",  # configuration runtime surchargeable par l'environnement (config.py)
    "fastapi>=0.115",  # service d'inférence (§11)
    "uvicorn[standard]>=0.34",  # serveur ASGI
    "prometheus-fastapi-instrumentator>=7.0",  # métriques d'exploitation (§13)
]

# Point d'entrée de la CLI d'industrialisation (§13, C9) : `decrochage-l1 predict|retrain`.
# `typer` vit dans le groupe `cli` ci-dessous, hors image d'inférence stricte.
[project.scripts]
decrochage-l1 = "decrochage_l1.cli:app"

# Groupes NON installés dans l'image API. Local complet : `uv sync --group analysis` ;
# image d'inférence : `uv sync --no-default-groups --no-dev` (runtime strict ci-dessus).
[dependency-groups]
# Développement : lint, format, tests. `httpx` alimente le client de test FastAPI.
dev = [
    "ruff>=0.15.21",
    "pytest>=9.1.1",
    "pre-commit>=4.6.0",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "missingno>=0.5.2",
    "ipywidgets>=8.1.9",  # widgets interactifs du notebook (barres de progression §9)
    "httpx>=0.28",
]
# CLI d'industrialisation (§13) : reproduire prépa+entraînement hors notebook, hors image API.
cli = [
    "typer>=0.12",
]
# Analyse : tout ce qui sert le dossier d'étude (notebook, §8-§9, §12), jamais l'image.
analysis = [
    "matplotlib>=3.11.1",
    "shap>=0.52.0",  # explicabilité globale §12 (l'API, elle, calcule les contributions analytiquement)
    "xgboost>=3.4.1",  # famille boosting comparée en §8
    "optuna>=4.9",  # réglage des hyperparamètres en §9 (TPE + pruning + budget borné)
    "codecarbon>=3.3",  # empreinte carbone du réglage en §9
    "xlsxwriter>=3.2",  # export Excel formaté du récapitulatif des métriques (§15.4)
]

# `src/` layout : indiquer explicitement le package à empaqueter.
[tool.hatch.build.targets.wheel]
packages = ["src/decrochage_l1"]

# --- Ruff : linter + formateur (remplace black + isort) ------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]
extend-exclude = [".venv*", "venv*", "dist", "build"]

[tool.ruff.lint]
# E  = style (pycodestyle)
# F  = erreurs logiques (pyflakes)
# I  = tri des imports (isort)
# UP = modernisation (pyupgrade)
# B  = pièges courants (bugbear)
# SIM = simplifications
# C4 = comprehensions
# N  = conventions de nommage
# RUF = règles ruff
# D1xx = présence des docstrings (pydocstyle) : module + classe/méthode/fonction publiques,
#        sans imposer leur mise en forme : docstrings en français, commentaires réservés au non-évident.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF", "D100", "D101", "D102", "D103"]

# Symboles mathématiques employés comme tels (ρ de Spearman, η rapport de corrélation,
# σ écart-type, × séparateur de dimensions) : les autoriser plutôt que RUF001/RUF003 ne
# les prenne pour des lettres latines ambiguës.
allowed-confusables = ["ρ", "η", "σ", "×"]

# Les fonctions de test se documentent par leur nom (`test_...`) et leurs assertions :
# ne pas exiger de docstring de module ni de fonction dans `tests/`.
[tool.ruff.lint.per-file-ignores]
# X / y : notation standard du couple (features, cible) en apprentissage - conservée dans
# tout test qui manipule un jeu d'entraînement.
"tests/**" = ["D100", "D103", "N806"]
"src/decrochage_l1/modeling/*.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
# Regroupe les imports du code interne dans un bloc distinct des paquets tiers.
known-first-party = ["decrochage_l1"]

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI : `Depends`/`Body`/`Query`/`Header` en valeurs par défaut d'arguments
# sont l'API prévue du framework, pas le piège B008 des appels mutables partagés.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Header",
    "typer.Option",  # idiome Typer : l'option se déclare en valeur par défaut d'argument (CLI §13)
    "typer.Argument",
]

[tool.ruff.format]
quote-style = "double"

# --- Pytest --------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Bruit d'import de starlette.testclient (dépendance) : il pousse httpx2 à la place de httpx.
    # Filtré au message pour ne pas masquer d'autres dépréciations, y compris les nôtres.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
